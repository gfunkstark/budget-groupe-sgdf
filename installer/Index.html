    '<div class="filtres">' + (g.logo || LOGO.indexOf('data:') === 0 ? '<img src="' + esc(g.logo || LOGO) + '" alt="" style="width:56px;height:56px;object-fit:contain">' : '<span class="puce">Aucun logo</span>') +
    '<input type="file" id="grLogo" accept="image/png,image/jpeg,image/webp"><button class="btn secondaire" onclick="sauverLogo()">Envoyer</button>' +
    (g.logo ? '<button class="btn discret" onclick="sauverLogo(true)">Retirer</button>' : '') + '</div></div>' + carteVersion();
}
/* Version installée / dernière version publiée sur GitHub */
function carteVersion() {
  var m = ETAT.maj;
  if (!m) { ETAT.maj = { attente: true }; appel('verifierMiseAJour').then(function (r) { ETAT.maj = r; if (ETAT.vue === 'parametres') afficher(); }).catch(function () { ETAT.maj = {}; }); m = ETAT.maj; }
  var lien = 'https://github.com/' + esc(m.depot || 'gfunkstark/budget-groupe-sgdf');
  var etat = m.attente ? '<span class="puce">vérification…</span>' : !m.derniere ? '<span class="puce">dernière version inconnue</span>' :
    m.aJour ? '<span class="puce ok">\u2713 à jour</span>' : '<span class="puce att">version ' + esc(m.derniere) + ' disponible</span>';
  return '<div class="carte"><h2>Version de l\u2019application</h2><p class="sous">Version installée : <b>' + esc(D.version || '') + '</b> ' + etat + '</p>' +
    (m.derniere && !m.aJour ? '<p class="aide">Pour mettre à jour : ouvre <a href="' + lien + '" target="_blank">le dépôt GitHub</a>, copie les fichiers du dossier <code>installer</code> ' +
      'à la place de Code.gs et Index dans l\u2019éditeur Apps Script, puis Déployer › Gérer les déploiements › Modifier › Nouvelle version. Tes données ne changent pas.</p>' :
      '<p class="aide">Les nouvelles versions sont publiées sur <a href="' + lien + '" target="_blank">' + lien.replace('https://', '') + '</a>.</p>') + '</div>';
}
function sauverGroupe() {
  appel('enregistrerGroupe', { nom: $('grNom').value, court: $('grCourt').value, adresse: $('grAdresse').value, ville: $('grVille').value })
    .then(function (g) { D.groupe = g; charger(true); toast('Groupe enregistré'); }).catch(erreur);
}
function sauverLogo(retirer) {
  var envoi = function (url) { return appel('enregistrerLogo', url).then(function (g) { D.groupe = g; afficher(); toast(retirer ? 'Logo retiré' : 'Logo enregistré'); }); };
  if (retirer) return envoi('').catch(erreur);
  var f = $('grLogo').files[0]; if (!f) return toast('Choisis une image.', true);
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var t = 160, k = Math.min(1, t / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      envoi(c.toDataURL('image/png')).catch(erreur);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function carteUrlApp() {
  return '<div class="carte"><h2>Adresse de l\u2019application</h2><p class="sous">Utilisée par le menu « ' + esc((D.groupe || {}).titre || 'Budget') + ' › Ouvrir l\u2019application » du classeur et par le bouton de l\u2019e-mail du lundi. ' +
    'Colle l\u2019adresse de ton déploiement (Déployer › Gérer les déploiements › Application Web › URL).</p><div class="filtres">' +
    '<input type="text" id="appUrl" value="' + esc(D.appUrl || '') + '" placeholder="https://script.google.com/macros/s/…/exec" style="min-width:min(560px,100%)">' +
    '<button class="btn secondaire" onclick="sauverUrlApp()">Enregistrer</button></div></div>';
}
function sauverDepot() {
  appel('enregistrerDepotRobot', $('depotRobot').value).then(function (d) { D.github.depot = d; afficher(); toast('Dépôt enregistré'); }).catch(erreur);
}
function sauverUrlApp() {
  appel('enregistrerUrlApp', $('appUrl').value).then(function (u) { D.appUrl = u; afficher(); toast('Adresse enregistrée'); }).catch(erreur);
}
function vueImports() {
  var h = '<div class="carte"><h2>Robot Comptaweb</h2><p class="sous">Le robot (GitHub Actions, dépôt <code>' + esc(D.github.depot) + '</code>) récupère chaque matin l’export Comptaweb de la saison courante, ' +
    'la requête « GS - Check Export Trésoriers » et la liste des justificatifs du Drive.</p>';
  h += '<div class="filtres"><label class="aide">Dépôt GitHub du robot <input type="text" id="depotRobot" value="' + esc(D.github.depot || '') + '" placeholder="propriétaire/nom-du-dépôt" style="min-width:240px"></label>' +
    '<button class="btn discret" onclick="sauverDepot()">Enregistrer</button></div>';
  h += '<div class="filtres">' + boutonRobot() +
    '<button class="btn discret" onclick="voirRobot()"' + (D.github.configure ? '' : ' disabled') + '>Voir les dernières exécutions</button>' +
    '<span class="aide">' + (D.journal.length ? 'Dernière mise à jour du classeur : ' + esc(dernierRobot()) : 'Le robot n’a encore rien écrit dans ce classeur.') + '</span></div><div id="etatRobot"></div>' +
    '<details' + (D.github.configure ? '' : ' open') + '><summary class="aide">' + (D.github.configure ? 'Jeton GitHub configuré' + (D.github.expiration ? ', expire le <b>' + dateFr(D.github.expiration) + '</b>' : '') + ' — le remplacer' : 'Configurer le jeton GitHub (nécessaire pour le bouton)') + '</summary>' +
    '<p class="aide">Sur GitHub : Settings › Developer settings › Fine-grained tokens › Generate. Dépôt : uniquement <code>' + esc(D.github.depot) +
    '</code>. Permission : <b>Actions</b> en lecture et écriture. Colle le jeton ci-dessous ; il est stocké dans les propriétés du script, pas dans le classeur.</p>' +
    '<div class="filtres"><input type="password" id="jeton" placeholder="github_pat_…" style="min-width:320px"><button class="btn secondaire" onclick="sauverJeton()">Enregistrer</button>' +
    (D.github.configure ? '<button class="btn danger" onclick="sauverJeton(true)">Retirer</button>' : '') + '</div></details></div>';

  h += '<div class="carte"><h2>Importer un export Comptaweb</h2><p class="sous">Pour une saison passée ou en secours si le robot ne tourne pas : Comptaweb › Recettes / dépenses › Export CSV. ' +
    'Le contenu de l’onglet de la saison est remplacé.</p><div class="filtres">' +
    '<label class="aide">Saison <input type="text" id="impSaison" value="' + esc(ETAT.saison) + '" style="width:90px"></label>' +
    '<input type="file" id="impFichier" accept=".csv,text/csv"><button class="btn secondaire" onclick="importer()">Importer</button></div></div>';

  h += editeur('Saisons');
  h += carteEmailHebdo();
  h += carteUrlApp();
  return h;
}

var AIDES = {
  Saisons: 'Une seule saison courante : c’est elle que le robot met à jour. Pour changer de saison en septembre : ajoute la ligne, coche « Courante », ' +
    'et indique l’exercice tel qu’il apparaît dans le sélecteur de Comptaweb.',
  Lignes: '« En recettes » : la ligne apparaît dans les recettes du groupe. « Section » : où vont ses dépenses (Activités, Fonctionnement…). « Hors budget » : flux de passage (camps, cotisations…). « Saisie du budget » : comment se construit le budget de dépenses de la ligne (automatique = deviné d\u2019après le nom).',
  Regles: 'Ordre d’application : activité + nature exactes, puis nature seule (activité *), puis activité seule (nature *). Les règles s’appliquent à toutes les saisons.',
  Unites: 'Branche/Pôle Comptaweb → unité suivie. Toutes les branches « Compagnons - … » vont dans l’unité de la branche « Compagnons ».'
};

var TITRES_TABLES = { Saisons: 'Saisons', Lignes: 'Lignes budgétaires', Regles: 'Règles de classement', Unites: 'Unités' };

function editeur(nom) {
  var cols = EDITEURS[nom], lignes = D[CLES_TABLES[nom]].slice();
  if (nom === 'Lignes' || nom === 'Unites') lignes.sort(function (a, b) { return (Number(a.ordre) || 0) - (Number(b.ordre) || 0); });
  if (nom === 'Regles') lignes.sort(function (a, b) {
    return String(a.ligne).localeCompare(String(b.ligne), 'fr') || String(a.activite).localeCompare(String(b.activite), 'fr') || String(a.nature).localeCompare(String(b.nature), 'fr');
  });
  var h = '<div class="carte"><div class="entete-carte"><h2>' + TITRES_TABLES[nom] + '</h2>' +
    (nom === 'Regles' ? '<input type="text" placeholder="Filtrer (activité, nature, ligne…)" oninput="filtrerEditeur(\'' + nom + '\', this.value)" style="min-width:240px">' : '') +
    '</div><p class="sous">' + AIDES[nom] + '</p><div class="tableau-defile"><table class="edit" id="ed' + nom + '" oninput="ETAT.modifie=true" onchange="ETAT.modifie=true"><thead><tr>' +
    cols.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
  lignes.forEach(function (r) { h += rangeeEditeur(nom, r); });
  h += '</tbody></table></div><div class="actions"><button class="btn discret" onclick="ajouterRangee(\'' + nom + '\')">+ Ajouter</button>' +
    '<button class="btn" onclick="sauverTable(\'' + nom + '\')">Enregistrer</button></div></div>';
  return h;
}
function filtrerEditeur(nom, texte) {
  var t = Engine.cle(texte);
  document.querySelectorAll('#ed' + nom + ' tbody tr').forEach(function (tr) {
    var contenu = Array.prototype.map.call(tr.querySelectorAll('[data-k]'), function (i) { return i.value; }).join(' ');
    tr.style.display = !t || Engine.cle(contenu).indexOf(t) >= 0 ? '' : 'none';
  });
}
function rangeeEditeur(nom, r) {
  return '<tr>' + EDITEURS[nom].map(function (c) {
    var v = r[c[0]];
    if (c[2] === 'bool') return '<td style="text-align:center"><input type="checkbox" data-k="' + c[0] + '"' + (v ? ' checked' : '') + '></td>';
    if (c[2] === 'saisie') return '<td style="min-width:190px"><select data-k="' + c[0] + '">' + options(SAISIES, v || '') + '</select></td>';
    if (c[2] === 'ligne') return '<td><select data-k="' + c[0] + '">' + options(nomsLignes().concat([Engine.INTERNE]), v, '—') + '</select></td>';
    return '<td><input type="' + (c[2] === 'num' ? 'number' : c[2] === 'date' ? 'date' : 'text') + '" data-k="' + c[0] + '" value="' + esc(v) + '"></td>';
  }).join('') + '<td><button class="btn danger" title="Supprimer la ligne" onclick="this.closest(\'tr\').remove();ETAT.modifie=true">✕</button></td></tr>';
}
function ajouterRangee(nom) {
  var tb = document.querySelector('#ed' + nom + ' tbody');
  tb.insertAdjacentHTML('beforeend', rangeeEditeur(nom, {}));
  ETAT.modifie = true;
  var champ = tb.lastElementChild.querySelector('input, select');
  if (champ) { champ.scrollIntoView({ block: 'center' }); champ.focus(); }
}
function lireEditeur(nom) {
  return Array.prototype.map.call(document.querySelectorAll('#ed' + nom + ' tbody tr'), function (tr) {
    var o = {};
    tr.querySelectorAll('[data-k]').forEach(function (i) { o[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; });
    return o;
  });
}
function sauverTable(nom) {
  var rows = lireEditeur(nom);
  appel('enregistrerTable', nom, rows).then(function () { ETAT.modifie = false; toast('Enregistré'); return charger(true); }).catch(erreur);
}

function joursAvantExpiration() {
  var e = D.github && D.github.expiration;
  return e ? Math.round((new Date(e + 'T12:00:00') - new Date(D.maintenant)) / 86400000) : null;
}
function sauverJeton(retirer) {
  var j = retirer ? '' : $('jeton').value;
  if (!retirer && !j) return toast('Colle d’abord le jeton.', true);
  appel('enregistrerJetonGithub', j).then(function (r) {
    if (typeof r === 'boolean') r = { configure: r, expiration: '' };
    D.github.configure = r.configure; D.github.expiration = r.expiration; charger(true);
    toast(r.configure ? 'Jeton vérifié et enregistré' + (r.expiration ? ' (expire le ' + dateFr(r.expiration) + ')' : '') : 'Jeton retiré');
  }).catch(erreur);
}
/** Message d'état du robot, affiché sur la Synthèse et dans Paramètres (même si on change de page). */
function etatRobotHtml() { return ETAT.robotMsg || ''; }
function majEtatRobot(html, enCours) {
  ETAT.robotMsg = html; ETAT.robotEnCours = !!enCours;
  document.querySelectorAll('.etat-robot').forEach(function (e) { e.innerHTML = html; });
  document.querySelectorAll('.btn-robot').forEach(function (b) { b.disabled = !!enCours; });
}
function boutonRobot(classe) {
  var court = /discret/.test(classe || '');
  if (!D.github.configure) return '<button class="btn ' + (classe || '') + '" title="Configure d’abord le jeton GitHub" onclick="ETAT.param=\'imports\';aller(\'parametres\')">' + (court ? 'Actualiser' : 'Actualiser depuis Comptaweb') + '</button>';
  return '<button class="btn btn-robot ' + (classe || '') + '"' + (ETAT.robotEnCours ? ' disabled' : '') + ' onclick="lancerRobot()">' +
    svg('<path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/>', 'width:15px;height:15px;vertical-align:-3px;margin-right:6px') + (court ? 'Actualiser' : 'Actualiser depuis Comptaweb') + '</button>';
}
function lancerRobot() {
  majEtatRobot('<div class="alerte info">Robot lancé. Il met en général 2 à 3 minutes ; les données se rechargeront toutes seules.</div>', true);
  var depart = Date.now();
  appel('actualiserComptaweb').then(function () {
    var suivre = function () {
      appel('etatRobot').then(function (runs) {
        var r = runs.filter(function (x) { return new Date(x.debut).getTime() > depart - 60000; })[0];
        if (r && r.statut === 'completed') {
          if (r.resultat === 'success') { majEtatRobot('', false); toast('Comptaweb actualisé'); charger(true); }
          else majEtatRobot('<div class="alerte ko">Le robot a échoué (' + esc(r.resultat) + '). <a href="' + esc(r.url) + '" target="_blank">Voir le détail sur GitHub</a></div>', false);
          return;
        }
        if (Date.now() - depart > 12 * 60000) { majEtatRobot('<div class="alerte">Le robot tourne encore. Recharge la page dans quelques minutes.</div>', false); return; }
        setTimeout(suivre, 20000);
      }).catch(function (e) { majEtatRobot('', false); erreur(e); });
    };
    setTimeout(suivre, 25000);
  }).catch(function (e) { majEtatRobot('', false); erreur(e); });
}
function voirRobot() {
  appel('etatRobot').then(function (runs) {
    $('etatRobot').innerHTML = '<table><thead><tr><th>Lancement</th><th>Déclencheur</th><th>Résultat</th><th></th></tr></thead><tbody>' + runs.map(function (r) {
      var res = r.statut !== 'completed' ? 'en cours' : r.resultat === 'success' ? 'réussi' : r.resultat;
      return '<tr><td>' + new Date(r.debut).toLocaleString('fr-FR') + '</td><td>' + ({ schedule: 'planifié', workflow_dispatch: 'manuel' }[r.declencheur] || esc(r.declencheur)) +
        '</td><td><span class="puce ' + (res === 'réussi' ? 'ok' : res === 'en cours' ? 'att' : 'ko') + '">' + esc(res) + '</span></td><td><a href="' + esc(r.url) + '" target="_blank">détail</a></td></tr>';
    }).join('') + '</tbody></table>';
  }).catch(erreur);
}
function importer() {
  var f = $('impFichier').files[0], s = $('impSaison').value.trim();
  if (!f || !s) return toast('Choisis la saison et le fichier.', true);
  var lire = function (enc) {
    return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.readAsText(f, enc); });
  };
  lire('UTF-8').then(function (t) { return t.indexOf('�') >= 0 ? lire('ISO-8859-1') : t; }).then(function (t) {
    toast('Import en cours…');
    return appel('importerCsv', s, t);
  }).then(function (r) { toast(r.ecritures + ' écritures importées dans « ' + r.onglet + ' »'); ETAT.saison = s; return charger(true); }).catch(erreur);
}

/* --------------------------------------------------------------- démarrage */
document.addEventListener('click', function (e) {
  var a = e.target.closest('#nav button[data-vue]');
  if (a) { e.preventDefault(); aller(a.dataset.vue); }
});
$('saison').addEventListener('change', function () { ETAT.saison = this.value; afficher(); });
$('btnRecharger').addEventListener('click', function () { charger(); });
$('modale').addEventListener('click', function (e) { if (e.target.id === 'modale') { fermerModale(); afficher(); } });
charger();

</script>
