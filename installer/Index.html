<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget du groupe</title>
<style>
:root {
  --fond: #f6f5f2; --carte: #ffffff; --texte: #1d2433; --doux: #6b7280; --ligne: #e6e3dc; --ligne-forte: #d6d2c8; --survol: #f1efe9;
  --accent: #1f4e79; --accent-doux: #e5edf6; --accent-texte: #ffffff;
  --bon: #1d7a4a; --bon-doux: #e3f3ea; --mauvais: #b42318; --mauvais-doux: #fdecea; --alerte: #9a6700; --alerte-doux: #fff4d6;
  --saisie: #fdf0c2; --saisie-survol: #fae39a; --bande: #f4f7fb; --info-doux: #e5edf6; --rayon: 10px; --ombre: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 16px rgba(20, 24, 33, .04);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #12151c; --carte: #1a1e27; --texte: #e7e9ee; --doux: #9aa3b2; --ligne: #2a303c; --ligne-forte: #3a4150; --survol: #222734;
    --accent: #8db8e8; --accent-doux: #1e2b3d; --accent-texte: #12151c;
    --bon: #5cc28b; --bon-doux: #17301f; --mauvais: #f08a80; --mauvais-doux: #3a1d1b; --alerte: #e2b347; --alerte-doux: #372c12;
    --saisie: #3a3218; --saisie-survol: #4a4020; --bande: #1b2230; --info-doux: #1e2b3d; --ombre: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--fond); color: var(--texte); }
body { font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

.app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
.nav { background: var(--carte); border-right: 1px solid var(--ligne); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.nav-main { flex: 1; overflow-y: auto; }
.nav-bas { border-top: 1px solid var(--ligne); padding-top: 8px; }
.nav-sep { border: 0; border-top: 1px solid var(--ligne); margin: 8px 10px; }
.brand { font-weight: 700; font-size: 16px; padding: 4px 10px 18px; letter-spacing: -.01em; }
.brand .logo-groupe { display: block; width: 64px; height: 64px; margin: 0 0 10px; }
.brand small { display: block; font-weight: 400; color: var(--doux); font-size: 12px; }
.nav button, .nav a.navlien { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 9px 10px;
  border-radius: 8px; cursor: pointer; text-align: left; color: var(--doux); font-weight: 500; text-decoration: none; }
.nav button svg, .nav a.navlien svg { width: 18px; height: 18px; flex: none; }
.nav button:hover, .nav a.navlien:hover { background: var(--survol); color: var(--texte); }
.nav button.on { background: var(--accent-doux); color: var(--accent); }
.nav .pill { margin-left: auto; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--bon-doux); color: var(--bon); }
.pill.ko { background: var(--mauvais-doux); color: var(--mauvais); }
.pill.wa { background: var(--alerte-doux); color: var(--alerte); }
.pill.pl { background: var(--accent-doux); color: var(--accent); }

main { min-width: 0; padding: 0 28px 48px; }
.barre { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; position: sticky; top: 0; background: var(--fond); z-index: 5; border-bottom: 1px solid var(--ligne); margin-bottom: 18px; }
.barre .who { color: var(--doux); font-size: 12px; }
.barre h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.barre-droite { display: flex; gap: 8px; align-items: center; }
.saison-choix { color: var(--doux); font-size: 13px; display: flex; gap: 6px; align-items: center; }

select, input[type=text], input[type=number], input[type=date], input[type=password], textarea {
  border: 1px solid var(--ligne-forte); background: var(--carte); border-radius: 7px; padding: 6px 8px; min-height: 32px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-texte); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; min-height: 32px; white-space: nowrap; }
.btn:hover { filter: brightness(1.05); }
.btn.secondaire { background: var(--carte); color: var(--accent); }
.btn.discret { background: transparent; border-color: var(--ligne-forte); color: var(--texte); font-weight: 500; }
.btn.danger { background: transparent; border-color: transparent; color: var(--mauvais); padding: 4px 8px; }
.btn:disabled { opacity: .5; cursor: default; }

.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 16px 18px; margin-bottom: 16px; }
.carte h2 { font-size: 15px; margin: 0 0 4px; }
.carte h3 { font-size: 14px; margin: 0; }
.carte .sous { color: var(--doux); font-size: 12.5px; margin: 0 0 12px; }
.entete-carte { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }

.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tuile { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 12px 14px; box-shadow: var(--ombre); }
.tuile .lib { color: var(--doux); font-size: 12px; }
.tuile .val { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tuile .det { color: var(--doux); font-size: 12px; margin-top: 2px; }
.tuile.cliquable { cursor: pointer; }
.tuile.cliquable:hover { border-color: var(--accent); }

.tableau-defile { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--ligne); text-align: left; vertical-align: middle; }
th { font-size: 11.5px; font-weight: 600; color: var(--doux); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.section td { background: var(--fond); font-weight: 650; font-size: 12.5px; color: var(--doux); text-transform: uppercase; letter-spacing: .03em; padding-top: 12px; }
tr.total td { font-weight: 650; border-top: 1px solid var(--ligne-forte); }
tr.grand-total td { font-weight: 700; font-size: 15px; border-top: 2px solid var(--texte); background: var(--accent-doux); }
tr.cliquable { cursor: pointer; }
tr.cliquable:hover td { background: var(--fond); }
td.col-n { border-left: 1px solid var(--ligne); }
td.lien { cursor: pointer; }
td.lien:hover { background: var(--accent-doux); color: var(--accent); text-decoration: underline; }
.positif { color: var(--bon); }
.negatif { color: var(--mauvais); }
.zero { color: var(--doux); }
.att { background: var(--alerte-doux); }

.jauge { height: 6px; border-radius: 3px; background: var(--ligne); overflow: hidden; min-width: 60px; }
.jauge > i { display: block; height: 100%; background: var(--accent); }
.jauge > i.depasse { background: var(--mauvais); }

.puce { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--fond); color: var(--doux); white-space: nowrap; }
.puce.ok { background: var(--bon-doux); color: var(--bon); }
.puce.ko { background: var(--mauvais-doux); color: var(--mauvais); }
.puce.att { background: var(--alerte-doux); color: var(--alerte); }

.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--ligne); margin-bottom: 16px; overflow-x: auto; }
.onglets button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--doux); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.onglets button:hover { color: var(--texte); }
.onglets button.actif { color: var(--accent); border-bottom-color: var(--accent); }
.onglets .compte { font-size: 11px; background: var(--fond); color: var(--doux); border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-weight: 600; }
.onglets button.actif .compte { background: var(--accent-doux); color: var(--accent); }
.filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filtres input[type=text] { min-width: 220px; }
.case { display: inline-flex; gap: 6px; align-items: center; color: var(--doux); }

.grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.formulaire { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.formulaire label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--doux); }

.edit td { padding: 3px 4px; }
.edit input, .edit select { width: 100%; min-height: 30px; padding: 4px 6px; }
.edit input.n { text-align: right; }
.edit td.calc { text-align: right; padding-right: 10px; font-weight: 600; white-space: nowrap; }

.ligne-budget { border-top: 1px solid var(--ligne); padding: 12px 0; }
.ligne-budget:first-of-type { border-top: 0; }
.ligne-budget .tete { display: flex; align-items: center; gap: 12px; cursor: pointer; flex-wrap: wrap; }
.ligne-budget .tete .nom { font-weight: 600; flex: 1; min-width: 200px; }
.ligne-budget .tete .chiffres { display: flex; gap: 18px; color: var(--doux); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ligne-budget .tete .chiffres b { color: var(--texte); }
.ligne-budget .tete .chiffres { align-items: center; }
input.saisie { background: var(--saisie); border-color: transparent; color: var(--accent); font-weight: 600; }
input.saisie:hover { background: var(--saisie-survol); }
.grille-blocs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 16px; align-items: start; }
.grille-blocs .carte { margin-bottom: 0; }
th.groupe-col { text-align: center; border-bottom: 1px solid var(--ligne-forte); }
table.sorties td, table.sorties th { white-space: nowrap; }
.montant-direct { width: 110px; margin-left: 6px; text-align: right; }
table.effectifs input { min-width: 64px; }
table.effectifs td:first-child { white-space: nowrap; }
.ligne-budget .corps { margin-top: 10px; }
.fleche { color: var(--doux); transition: transform .15s; display: inline-block; width: 14px; }
.ouvert .fleche { transform: rotate(90deg); }

.alerte { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; background: var(--alerte-doux); color: var(--alerte); }
.alerte.ko { background: var(--mauvais-doux); color: var(--mauvais); }
.alerte.info { background: var(--info-doux); color: var(--texte); }
.vide { color: var(--doux); padding: 18px 0; text-align: center; }
.chargement { color: var(--doux); padding: 60px 0; text-align: center; }
.aide { color: var(--doux); font-size: 12.5px; }
code { font-family: var(--mono); font-size: 12px; background: var(--fond); padding: 1px 5px; border-radius: 4px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--texte); color: var(--fond); padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw; }
.toast.visible { opacity: 1; transform: translateX(-50%); }
.toast.ko { background: var(--mauvais); color: #fff; }
.modale { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modale-boite { background: var(--carte); border-radius: 12px; padding: 20px; width: min(520px, 100%); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.modale-boite h2 { margin: 0 0 8px; font-size: 17px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .nav { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; flex-direction: row; padding: 4px; z-index: 20; border-right: 0; border-top: 1px solid var(--ligne); overflow-x: auto; }
  .brand, .nav-sep { display: none; }
  .nav-main, .nav-bas { display: contents; }
  .nav button, .nav a.navlien { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 8px; text-align: center; white-space: nowrap; width: auto; position: relative; }
  .nav a.navlien svg + svg { display: none; }
  .nav .pill { position: absolute; top: 0; right: 2px; font-size: 10px; padding: 0 5px; }
  .barre .who { display: none; }
  main { padding: 0 16px 90px; }
  .barre h1 { font-size: 18px; }
  .masque-mobile { display: none; }
}

/* Tableaux de budget : libellé large, colonnes de chiffres serrées, colonne du budget N teintée */
table.budget { width: 100%; }
table.budget col.c-n, table.budget col.c-bn { width: 112px; }
table.budget col.c-bn { background: var(--bande); }
table.budget th { padding-top: 8px; padding-bottom: 8px; }
table.budget td { padding-top: 7px; padding-bottom: 7px; }
table.budget.edit td { padding: 4px 8px; }
table.budget td.n, table.budget th.n { padding-right: 12px; }
table.budget td.col-n, table.budget th.col-n { border-left: 0; }
table.budget tbody tr:hover td { background: rgba(31, 78, 121, .035); }
table.budget tr.total td { border-top: 2px solid var(--ligne-forte); background: var(--survol); }
table.budget tr.grand-total td { border-top: 2px solid var(--texte); background: var(--accent-doux); }
table.budget th.groupe-col { font-size: 11px; letter-spacing: .05em; color: var(--doux); border-bottom: 0; padding-bottom: 0; }
table.budget input.saisie { width: 100%; max-width: 96px; margin-left: auto; display: block; }
table.budget input.eff { width: 100%; max-width: 72px; margin-left: auto; display: block; }
table.budget .calc { font-weight: 600; }
table.budget tr.parent td { border-bottom-color: transparent; }
table.budget tr.detail td { border-bottom: 1px dashed var(--ligne); background: transparent; }
table.budget tr.detail td:first-child { padding-left: 26px; }
.detail-lib { display: flex; gap: 8px; align-items: center; }
.detail-lib input[type=text] { flex: 1; max-width: 340px; min-height: 28px; }
.detail-lib .indice { min-width: 84px; }
a.lien-discret { font-size: 12px; color: var(--doux); margin-left: 6px; }
a.lien-discret:hover { color: var(--accent); }
.btn.petit { padding: 3px 10px; min-height: 26px; font-size: 12.5px; }
.grille-blocs table.budget col.c-n, .grille-blocs table.budget col.c-bn { width: 100px; }
.grille-blocs table.budget td:first-child, .grille-blocs table.budget th { white-space: nowrap; }

table.budget col.c-act { width: 130px; }
.fleche.tourne { transform: rotate(90deg); }
table.detail-fonds { font-size: 12.5px; margin: 4px 0 8px; }
table.detail-fonds th, table.detail-fonds td { padding: 4px 8px; }
table.detail-fonds td:nth-child(2), table.detail-fonds td:nth-child(3) { white-space: nowrap; }
table.detail-fonds tr.exclu td { color: var(--doux); text-decoration: line-through; }
table.detail-fonds tr.exclu td:first-child { text-decoration: none; }

a.piece { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; white-space: nowrap; }
a.piece:hover { text-decoration: underline; }
#robotEntete .btn { font-size: 13px; }
.etat-robot:empty { display: none; }

.bandeau-version { margin: -6px 0 12px; }
table.budget tr.modifie td { background: var(--saisie); }

.routine .etape { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ligne); }
.routine .etape:last-child { border-bottom: 0; }
.routine .etape label { display: flex; gap: 12px; align-items: flex-start; flex: 1; cursor: pointer; }
.routine .etape input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; flex: none; }
.routine .etape.faite b { color: var(--doux); font-weight: 600; }
.aide-page p, .aide-page li { line-height: 1.6; }
.aide-page ol, .aide-page ul { padding-left: 20px; margin: 6px 0; }
a.depot { color: var(--accent); vertical-align: -2px; margin-left: 2px; }

</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"><div class="brand">Budget</div></aside>
  <main>
    <header class="barre">
      <h1 id="titre">Synthèse</h1>
      <div class="barre-droite">
        <span class="who" id="infoDonnees"></span>
        <span id="robotEntete"></span>
        <label class="saison-choix">Saison <select id="saison"></select></label>
        <button class="btn discret" id="btnRecharger" title="Relire le classeur">↻</button>
      </div>
    </header>
    <div id="alertes"></div>
    <div class="etat-robot" id="etatRobotGlobal"></div>
    <section id="vue"><div class="chargement">Chargement des données…</div></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="modale" class="modale" hidden><div class="modale-boite" id="modaleBoite"></div></div>
<script>
/* =====================================================================
 * Moteur de calcul — Budget du groupe (Scouts et Guides de France)
 * Partagé tel quel par le serveur (Code.gs), l'interface (Index) et les tests.
 * Aucune dépendance à Apps Script ni au navigateur.
 * ===================================================================== */
var Engine = (function () {

  /* ------------------------------------------------------------ utilitaires */
  function txt(v) { return v === null || v === undefined ? '' : String(v).replace(/\s+$/, '').replace(/^\s+/, ''); }
  function cle(v) { return txt(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' '); }

  /** Nombre depuis une cellule (nombre, "1 234,56", "(12)", "-", ""). */
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = txt(v).replace(/[   €]/g, '');
    if (!s || s === '-') return 0;
    var neg = /^\(.*\)$/.test(s);
    s = s.replace(/[()]/g, '');
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '');
    s = s.replace(',', '.');
    var n = parseFloat(s);
    if (!isFinite(n)) return 0;
    return neg ? -n : n;
  }
  function arrondi(n) { return Math.round(n * 100) / 100; }

  /** Date ISO yyyy-mm-dd depuis "dd/mm/yyyy", Date, ou ISO. */
  function dateIso(v) {
    if (v instanceof Date) {
      return v.getFullYear() + '-' + ('0' + (v.getMonth() + 1)).slice(-2) + '-' + ('0' + v.getDate()).slice(-2);
    }
    var s = txt(v), m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[0] : '';
  }

  /* ------------------------------------------------- import des écritures */
  // En-têtes de l'export Comptaweb « recettes / dépenses ».
  var COLS = {
    date: 'Date', compte: 'Compte bancaire 1', rappro: 'Rapprochée 1', compte2: 'Compte bancaire 2',
    rappro2: 'Rapprochée 2', intitule: 'Intitulé', depense: 'Dépense', recette: 'Recette',
    piece: 'N° de pièce', mode: 'Mode de transaction', tiersCat: 'Catégorie tiers',
    tiers: 'Structure tiers', type: 'Type', nature: 'Nature', activite: 'Activité',
    branche: 'Branche/Pôle', depV: 'Dépense ventilation', recV: 'Recette ventilation'
  };

  /** Index des colonnes à partir d'une ligne d'en-têtes (tolérant accents/espaces). */
  function indexEntetes(entetes) {
    var idx = {}, cles = entetes.map(cle);
    Object.keys(COLS).forEach(function (k) {
      var i = cles.indexOf(cle(COLS[k]));
      if (i < 0 && k === 'branche') i = cles.indexOf('branche');
      idx[k] = i;
    });
    var manquantes = ['date', 'intitule', 'type', 'nature', 'activite', 'branche', 'depV', 'recV']
      .filter(function (k) { return idx[k] < 0; });
    if (manquantes.length) throw new Error('Colonnes Comptaweb introuvables : ' + manquantes.map(function (k) { return COLS[k]; }).join(', '));
    return idx;
  }

  /**
   * Transforme les lignes brutes de l'export (tableau de tableaux, en-têtes en
   * première ligne) en écritures et ventilations. Chaque ventilation est
   * rattachée à l'écriture qui la précède dans l'export.
   */
  function lireExport(lignes) {
    if (!lignes || !lignes.length) return { ecritures: [], ventilations: [] };
    var idx = indexEntetes(lignes[0]);
    var g = function (r, k) { return idx[k] >= 0 ? r[idx[k]] : ''; };
    var ecritures = [], ventilations = [], courante = null, vus = {};
    for (var i = 1; i < lignes.length; i++) {
      var r = lignes[i], type = cle(g(r, 'type'));
      if (type === 'ecriture') {
        courante = {
          id: 'E' + ecritures.length, date: dateIso(g(r, 'date')), intitule: txt(g(r, 'intitule')),
          depense: num(g(r, 'depense')), recette: num(g(r, 'recette')), piece: txt(g(r, 'piece')),
          mode: txt(g(r, 'mode')), tiersCat: txt(g(r, 'tiersCat')), tiers: txt(g(r, 'tiers')),
          compte: txt(g(r, 'compte')), rappro: txt(g(r, 'rappro')), compte2: txt(g(r, 'compte2')),
          rappro2: txt(g(r, 'rappro2')), nbVentil: 0
        };
        ecritures.push(courante);
      } else if (type === 'ventilation') {
        var v = {
          date: dateIso(g(r, 'date')), intitule: txt(g(r, 'intitule')), nature: txt(g(r, 'nature')),
          activite: txt(g(r, 'activite')), branche: txt(g(r, 'branche')),
          depense: num(g(r, 'depV')), recette: num(g(r, 'recV')),
          ecriture: courante && courante.intitule === txt(g(r, 'intitule')) ? courante.id : '',
          piece: txt(g(r, 'piece'))
        };
        if (courante && v.ecriture) { courante.nbVentil++; if (!v.piece) v.piece = courante.piece; }
        // Clé stable pour les corrections manuelles : contenu + rang parmi les doublons.
        var base = [v.date, v.intitule, v.nature, v.activite, v.branche, v.depense, v.recette].join('|');
        vus[base] = (vus[base] || 0) + 1;
        v.cle = base + '#' + vus[base];
        ventilations.push(v);
      }
    }
    return { ecritures: ecritures, ventilations: ventilations };
  }

  /* ------------------------------------------------------- classement */
  var INTERNE = '(Mouvement interne)';

  /**
   * Règles : [{activite, nature, ligne}] — '*' = n'importe laquelle.
   * Priorité : activité+nature exactes > nature seule > activité seule.
   */
  function compilerRegles(regles) {
    var exact = {}, parNature = {}, parActivite = {};
    (regles || []).forEach(function (r) {
      var a = cle(r.activite), n = cle(r.nature), l = txt(r.ligne);
      if (!l) return;
      if (a && a !== '*' && n && n !== '*') exact[a + '¦' + n] = l;
      else if ((!a || a === '*') && n && n !== '*') parNature[n] = l;
      else if (a && a !== '*') parActivite[a] = l;
    });
    return function (activite, nature) {
      var a = cle(activite), n = cle(nature);
      return exact[a + '¦' + n] || parNature[n] || parActivite[a] || '';
    };
  }

  /** Branche/Pôle Comptaweb → unité suivie. */
  function compilerUnites(unites) {
    var m = {};
    (unites || []).forEach(function (u) { if (txt(u.branche)) m[cle(u.branche)] = txt(u.unite); });
    return function (branche) {
      var b = cle(branche);
      if (m[b]) return m[b];
      if (b.indexOf('compagnons') === 0) return m['compagnons'] || 'Compagnons';
      return txt(branche) || 'Groupe';
    };
  }

  /**
   * Classe toutes les ventilations. corrections : {cle: ligne} pour les
   * exceptions saisies une par une.
   */
  function classer(ventilations, regles, unites, corrections) {
    var regle = compilerRegles(regles), unite = compilerUnites(unites), corr = corrections || {};
    return ventilations.map(function (v) {
      var ligne = corr[v.cle], source = 'correction';
      if (!ligne) { ligne = regle(v.activite, v.nature); source = ligne ? 'regle' : 'aucune'; }
      var o = {};
      for (var k in v) o[k] = v[k];
      o.ligne = ligne; o.source = source; o.unite = unite(v.branche);
      return o;
    });
  }

  /* -------------------------------------------------------- budget */
  /** Effectifs : [{saison, unite, jeunes}] → fonction (saison, unite) → nombre. */
  function compilerEffectifs(effectifs) {
    var m = {};
    (effectifs || []).forEach(function (e) {
      var s = txt(e.saison);
      m[s] = m[s] || { total: 0 };
      m[s][cle(e.unite)] = num(e.jeunes);
      if (cle(e.unite) !== 'groupe') m[s].total += num(e.jeunes);
    });
    return {
      unite: function (s, u) { return (m[s] && m[s][cle(u)]) || 0; },
      total: function (s) {
        if (!m[s]) return 0;
        return m[s].groupe || m[s].total;
      }
    };
  }

  var METHODES = {
    montant: 'Montant',
    qte_pu: 'Quantité × prix',
    par_jeune: '€ par jeune de l’unité',
    par_jeune_groupe: '€ par jeune du groupe'
  };

  /** Montant d'un poste de budget selon sa méthode. */
  function montantPoste(p, eff) {
    var m = txt(p.methode) || 'montant';
    if (m === 'qte_pu') return arrondi(num(p.quantite) * num(p.prix));
    if (m === 'par_jeune') return arrondi(eff.unite(p.saison, p.unite) * num(p.prix));
    if (m === 'par_jeune_groupe') return arrondi(eff.total(p.saison) * num(p.prix));
    return arrondi(num(p.montant));
  }

  /** Quantité affichée d'un poste (effectif pour les méthodes par jeune). */
  function quantitePoste(p, eff) {
    var m = txt(p.methode);
    if (m === 'par_jeune') return eff.unite(p.saison, p.unite);
    if (m === 'par_jeune_groupe') return eff.total(p.saison);
    if (m === 'qte_pu') return num(p.quantite);
    return null;
  }

  /* ------------------------------------------------------ synthèse */
  /**
   * Agrège les ventilations classées par ligne : {ligne: {r, d}}.
   * Les mouvements internes et non classées sont mis à part.
   */
  function agreger(classees) {
    var t = {};
    classees.forEach(function (v) {
      if (v.ligne === INTERNE) return;
      var k = v.ligne || '';
      t[k] = t[k] || { r: 0, d: 0 };
      t[k].r += v.recette; t[k].d += v.depense;
    });
    for (var k in t) { t[k].r = arrondi(t[k].r); t[k].d = arrondi(t[k].d); }
    return t;
  }

  function sommeBudget(budget, saison, eff) {
    var t = {};
    (budget || []).forEach(function (p) {
      if (txt(p.saison) !== saison) return;
      var k = txt(p.ligne), s = cle(p.sens) === 'recette' ? 'r' : 'd';
      t[k] = t[k] || { r: 0, d: 0 };
      t[k][s] += montantPoste(p, eff);
    });
    for (var k in t) { t[k].r = arrondi(t[k].r); t[k].d = arrondi(t[k].d); }
    return t;
  }

  function sommeEngagements(engagements, saison) {
    var t = {};
    (engagements || []).forEach(function (e) {
      if (txt(e.saison) !== saison || cle(e.statut) === 'regle' || cle(e.statut) === 'annule') return;
      var k = txt(e.ligne), s = cle(e.sens) === 'recette' ? 'r' : 'd';
      t[k] = t[k] || { r: 0, d: 0 };
      t[k][s] += num(e.montant);
    });
    for (var k in t) { t[k].r = arrondi(t[k].r); t[k].d = arrondi(t[k].d); }
    return t;
  }

  /**
   * Construit la synthèse de la saison `saison`.
   * donnees = { saisons:[{code}], classees:{code:[ventilations classées]},
   *             lignes:[{ligne, recette, section, horsBudget, ordre}], budget, engagements, effectifs }
   * Retourne { colonnes, sections:[{titre, sens, lignes:[...], total}], net, horsBudget, aClasser }.
   * Montants signés : recettes positives, dépenses négatives.
   */
  function synthese(donnees, saison) {
    var codes = donnees.saisons.map(function (s) { return s.code; });
    var i = codes.indexOf(saison);
    var n1 = i > 0 ? codes[i - 1] : null, n2 = i > 1 ? codes[i - 2] : null;
    var eff = compilerEffectifs(donnees.effectifs);
    var reel = {};
    [saison, n1, n2].forEach(function (c) { if (c) reel[c] = agreger(donnees.classees[c] || []); });
    var bud = sommeBudget(donnees.budget, saison, eff);
    var eng = sommeEngagements(donnees.engagements, saison);
    var vide = { r: 0, d: 0 };

    var lignes = (donnees.lignes || []).slice().sort(function (a, b) { return num(a.ordre) - num(b.ordre); });
    var connues = {};
    lignes.forEach(function (l) { connues[txt(l.ligne)] = l; });

    function rangee(nom, s) {
      var get = function (t) { return (t && t[nom]) || vide; };
      var sg = s === 'r' ? 1 : -1;
      var r2 = n2 ? sg * get(reel[n2])[s] : null, r1 = n1 ? sg * get(reel[n1])[s] : null;
      var b = sg * get(bud)[s], r = sg * get(reel[saison])[s], e = sg * get(eng)[s];
      var p = r + e;
      return {
        ligne: nom, n2: r2, n1: r1, budget: arrondi(b), varN1: r1 === null ? null : arrondi(b - r1),
        reel: arrondi(r), varBudget: arrondi(r - b), engage: arrondi(e), projete: arrondi(p),
        varProjete: arrondi(p - b)
      };
    }
    function nonVide(x) { return x.n2 || x.n1 || x.budget || x.reel || x.engage; }
    function total(rs) {
      var t = { ligne: 'Total' };
      ['n2', 'n1', 'budget', 'varN1', 'reel', 'varBudget', 'engage', 'projete', 'varProjete'].forEach(function (k) {
        var any = rs.some(function (x) { return x[k] !== null && x[k] !== undefined; });
        t[k] = any ? arrondi(rs.reduce(function (a, x) { return a + (x[k] || 0); }, 0)) : null;
      });
      return t;
    }

    // Toutes les lignes qui ont un montant quelque part.
    var presentes = {};
    [reel[saison], reel[n1], reel[n2], bud, eng].forEach(function (t) { if (t) for (var k in t) presentes[k] = true; });
    delete presentes[''];

    var sections = [], hors = [];
    // Recettes du groupe
    var rec = [];
    lignes.forEach(function (l) {
      if (l.horsBudget) return;
      var x = rangee(txt(l.ligne), 'r');
      if (l.recette || nonVide(x)) rec.push(x);
    });
    sections.push({ titre: 'Recettes du groupe', sens: 'r', lignes: rec, total: total(rec) });
    // Dépenses par section
    var noms = [];
    // Ordre des sections : celui de leur première ligne purement « dépense ».
    [false, true].forEach(function (avecRecette) {
      lignes.forEach(function (l) {
        if (!l.horsBudget && !!l.recette === avecRecette && txt(l.section) && noms.indexOf(txt(l.section)) < 0) noms.push(txt(l.section));
      });
    });
    var depParSection = {};
    noms.forEach(function (sn) { depParSection[sn] = []; });
    var autres = [];
    lignes.forEach(function (l) {
      if (l.horsBudget) return;
      var x = rangee(txt(l.ligne), 'd');
      if (txt(l.section)) depParSection[txt(l.section)].push(x);
      else if (nonVide(x)) autres.push(x);
    });
    noms.forEach(function (sn) {
      var rs = depParSection[sn];
      sections.push({ titre: 'Dépenses — ' + sn, sens: 'd', lignes: rs, total: total(rs) });
    });
    // Lignes inconnues du référentiel (créées par une règle sans être déclarées)
    Object.keys(presentes).forEach(function (k) {
      if (connues[k] || k === INTERNE) return;
      var xr = rangee(k, 'r'), xd = rangee(k, 'd');
      if (nonVide(xr)) rec.push(xr);
      if (nonVide(xd)) autres.push(xd);
    });
    sections[0].total = total(rec);
    if (autres.length) sections.push({ titre: 'Dépenses — Autres', sens: 'd', lignes: autres, total: total(autres) });

    var net = total(sections.map(function (s) { return s.total; }));
    net.ligne = 'Résultat du groupe';

    // Hors budget : flux de passage
    lignes.forEach(function (l) {
      if (!l.horsBudget) return;
      var nom = txt(l.ligne), xr = rangee(nom, 'r'), xd = rangee(nom, 'd');
      hors.push({ ligne: nom, recettes: xr, depenses: xd, solde: total([xr, xd]) });
    });
    var soldeHors = total(hors.map(function (h) { return h.solde; }));
    soldeHors.ligne = 'Solde des flux hors budget';

    var aClasser = (donnees.classees[saison] || []).filter(function (v) { return !v.ligne; });
    var nc = agreger(aClasser)[''] || vide;

    return {
      saison: saison, n1: n1, n2: n2, sections: sections, net: net, horsBudget: hors,
      soldeHorsBudget: soldeHors, aClasser: { nombre: aClasser.length, recettes: nc.r, depenses: nc.d }
    };
  }

  /* ---------------------------------------------- flux par unité (camps…) */
  /** Recettes / dépenses par unité pour les lignes hors budget de la saison. */
  function fluxParUnite(classees, lignes) {
    var hors = {};
    (lignes || []).forEach(function (l) { if (l.horsBudget) hors[txt(l.ligne)] = true; });
    var t = {};
    classees.forEach(function (v) {
      if (!hors[v.ligne]) return;
      var u = v.unite || 'Groupe';
      t[u] = t[u] || {};
      t[u][v.ligne] = t[u][v.ligne] || { r: 0, d: 0 };
      t[u][v.ligne].r += v.recette; t[u][v.ligne].d += v.depense;
    });
    return t;
  }

  /** Réel par ligne et par unité (pour le € par jeune N-1). */
  function reelParUnite(classees, ligne) {
    var t = {};
    classees.forEach(function (v) {
      if (v.ligne !== ligne) return;
      t[v.unite] = arrondi((t[v.unite] || 0) + v.depense - v.recette);
    });
    return t;
  }

  /* --------------------------------------------------------- contrôles */
  /** Identifiant de justificatif depuis un nom de fichier « 20260919_13 - …pdf ». */
  function idFichier(nom) {
    var m = txt(nom).match(/^(\d{7,8}_\d+)/);
    return m ? m[1] : '';
  }

  var MODES_SANS_PIECE = ['caisse (depot)', 'caisse (retrait)', 'caisse (transfert)', 'especes', 'cheque'];

  /**
   * Justificatifs : écritures de dépense qui en demandent un, et leur état.
   * Ne sont pas concernés : prélèvements de l'échelon national, mouvements internes,
   * recettes, montants négatifs (remboursements).
   */
  function controleJustificatifs(ecritures, fichiers) {
    var ids = {};
    (fichiers || []).forEach(function (f) { var id = idFichier(f); if (id) ids[id] = f; });
    var utilises = {}, manquants = [];
    ecritures.forEach(function (e) {
      if (e.piece && ids[e.piece]) utilises[e.piece] = true;
      if (!(e.depense > 0)) return;
      if (cle(e.tiersCat) === 'echelon national' || cle(e.tiersCat) === 'mon groupe') return;
      if (MODES_SANS_PIECE.indexOf(cle(e.mode)) >= 0 && cle(e.mode) !== 'cheque') return;
      if (!e.piece) manquants.push({ ecriture: e, probleme: 'Pas de n° de pièce' });
      else if (!ids[e.piece]) manquants.push({ ecriture: e, probleme: 'Justificatif absent du Drive' });
    });
    var orphelins = Object.keys(ids).filter(function (id) { return !utilises[id]; }).map(function (id) { return ids[id]; });
    return { manquants: manquants, orphelins: orphelins };
  }

  /** Écritures bancaires non rapprochées depuis plus de `jours` jours. */
  function nonRapprochees(ecritures, aujourdHui, jours) {
    var limite = new Date(aujourdHui.getTime() - (jours || 15) * 86400000);
    var lim = dateIso(limite);
    return ecritures.filter(function (e) {
      var r1 = e.compte && cle(e.rappro) === 'non', r2 = e.compte2 && cle(e.rappro2) === 'non';
      return (r1 || r2) && e.date && e.date <= lim;
    });
  }

  /* ------------------------------------------- rapprochement bancaire */
  /** Export Comptaweb « mouvements bancaires » → [{date, compte, montant, intitule}] (non rapprochés seulement). */
  function lireBanque(lignes) {
    if (!lignes || lignes.length < 2) return [];
    var c = lignes[0].map(cle), i = function (n) { return c.indexOf(n); };
    var iD = i('date'), iC = i('compte bancaire'), iM = i('montant'), iI = i('intitule'), iR = c.findIndex ? c.findIndex(function (x) { return /^rapproch/.test(x); }) : -1;
    if (iD < 0 || iM < 0) throw new Error('Colonnes Date / Montant introuvables dans les mouvements bancaires');
    return lignes.slice(1).filter(function (r) { return txt(r[iD]) && (iR < 0 || cle(r[iR]) !== 'oui'); }).map(function (r, n) {
      return { id: 'b' + n, date: dateIso(r[iD]), compte: iC >= 0 ? txt(r[iC]) : '', montant: arrondi(num(r[iM])), intitule: iI >= 0 ? txt(r[iI]) : '' };
    });
  }

  /** Écritures non rapprochées sur un compte bancaire, montant vu du compte (+ entrée, − sortie). */
  function ecrituresBancairesNonRapprochees(ecritures, comptes) {
    var ok = function (c) { return c && (!comptes || comptes.indexOf(cle(c)) >= 0); }, out = [];
    (ecritures || []).forEach(function (e) {
      var m = arrondi(num(e.recette) - num(e.depense));
      if (ok(e.compte) && cle(e.rappro) === 'non') out.push({ ecriture: e, compte: e.compte, montant: m });
      if (ok(e.compte2) && cle(e.rappro2) === 'non') out.push({ ecriture: e, compte: e.compte2, montant: -m });
    });
    return out;
  }

  /**
   * Met en regard les mouvements bancaires et les écritures non rapprochés :
   * paires probables = même compte, même montant (au centime, signe ignoré), à 30 jours près, la plus proche en date.
   * → { paires: [{mouvement, ecriture, ecart}], mouvements: [...seuls], ecritures: [...seules] }
   */
  function rapprochementBancaire(mouvements, ecritures, joursMax) {
    var max = (joursMax || 30) * 86400000, prises = {}, paires = [], seuls = [];
    var jour = function (d) { return new Date(d + 'T12:00:00').getTime(); };
    var comptes = {}; (mouvements || []).forEach(function (m) { if (m.compte) comptes[cle(m.compte)] = 1; });
    var nr = ecrituresBancairesNonRapprochees(ecritures, Object.keys(comptes).length ? Object.keys(comptes) : null);
    (mouvements || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (m) {
      var best = -1, ecart = Infinity;
      nr.forEach(function (x, k) {
        if (prises[k] || Math.abs(Math.abs(x.montant) - Math.abs(m.montant)) > 0.005) return;
        if (m.compte && cle(x.compte) !== cle(m.compte)) return;
        var d = Math.abs(jour(x.ecriture.date) - jour(m.date));
        if (d <= max && d < ecart) { best = k; ecart = d; }
      });
      if (best >= 0) { prises[best] = 1; paires.push({ mouvement: m, ecriture: nr[best].ecriture, montant: nr[best].montant, ecart: Math.round(ecart / 86400000) }); }
      else seuls.push(m);
    });
    return { paires: paires, mouvements: seuls, ecritures: nr.filter(function (x, k) { return !prises[k]; }) };
  }

  /**
   * Engagements ouverts pour lesquels une écriture correspondante est arrivée :
   * même ligne, même sens, montant à 1 € ou 2 % près, datée au plus 60 jours avant l'engagement.
   * Une ventilation ne sert qu'à un engagement. → [{engagement, ventilation}]
   */
  function correspondancesEngagements(engagements, classees, saison) {
    var prises = {}, out = [];
    (engagements || []).filter(function (e) {
      return txt(e.saison) === saison && cle(e.statut) !== 'regle' && cle(e.statut) !== 'annule' && num(e.montant) > 0;
    }).sort(function (a, b) { return txt(a.date) < txt(b.date) ? -1 : 1; }).forEach(function (e) {
      var m = num(e.montant), recette = cle(e.sens) === 'recette', tol = Math.max(1, m * 0.02);
      var avant = e.date ? dateIso(new Date(new Date(txt(e.date) + 'T12:00:00').getTime() - 60 * 86400000)) : '';
      var v = (classees || []).filter(function (x) {
        return !prises[x.cle] && x.ligne === e.ligne && Math.abs((recette ? x.recette : x.depense) - m) <= tol && (!avant || x.date >= avant);
      }).sort(function (a, b) { return Math.abs((recette ? a.recette : a.depense) - m) - Math.abs((recette ? b.recette : b.depense) - m); })[0];
      if (v) { prises[v.cle] = 1; out.push({ engagement: e, ventilation: v }); }
    });
    return out;
  }

  return {
    lireBanque: lireBanque, ecrituresBancairesNonRapprochees: ecrituresBancairesNonRapprochees, rapprochementBancaire: rapprochementBancaire,
    correspondancesEngagements: correspondancesEngagements,
    txt: txt, cle: cle, num: num, arrondi: arrondi, dateIso: dateIso,
    INTERNE: INTERNE, METHODES: METHODES,
    lireExport: lireExport, classer: classer, compilerRegles: compilerRegles,
    compilerEffectifs: compilerEffectifs, montantPoste: montantPoste, quantitePoste: quantitePoste,
    agreger: agreger, synthese: synthese, fluxParUnite: fluxParUnite, reelParUnite: reelParUnite,
    idFichier: idFichier, controleJustificatifs: controleJustificatifs, nonRapprochees: nonRapprochees
  };
})();

if (typeof module !== 'undefined') module.exports = Engine;

<script>
/* =====================================================================
 * Interface — Budget & suivi d'un groupe Scouts et Guides de France
 * ===================================================================== */
var D = null;          // données lues dans le classeur
var C = {};            // ventilations classées par saison
var ETAT = { vue: 'synthese', saison: '', param: 'groupe', modifie: false, filtre: { ligne: '', unite: '', texte: '', limite: 200 }, ouverts: {} };
var VUES = [
  ['synthese', 'Synthèse'], ['routine', 'Routine du mois'], ['budget', 'Budget - Dépenses'], ['recettes', 'Budget - Recettes'], ['realise', 'Réalisé'], ['engagements', 'À venir'],
  ['flux', 'Camps & flux'], ['controles', 'Contrôles'], ['parametres', 'Paramètres']
];
/* Menu : groupes séparés par un trait ; Contrôles et Paramètres en bas (comme l'app Budget famille). */
var LOGO = '/*LOGO*/';   // remplacé au build par le logo du groupe (app/src/logo.png)
var NAV_GROUPES = [['synthese', 'routine'], ['budget', 'recettes'], ['realise', 'engagements'], ['flux']];

/* ------------------------------------------------------------ utilitaires */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
var NF2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/** Montant entier, négatifs entre parenthèses, zéro en tiret. */
function fmt(n) {
  if (n === null || n === undefined || n === '') return '';
  var r = Math.round(n);
  if (r === 0) return '<span class="zero">–</span>';
  return r < 0 ? '(' + NF0.format(-r) + ')' : NF0.format(r);
}
function fmt2(n) { n = Math.round((n || 0) * 100) / 100; return n ? NF2.format(n) : ''; }
function euros(n) { return NF0.format(Math.round(n || 0)) + ' €'; }
function ecart(n) {
  if (n === null || n === undefined) return '';
  var r = Math.round(n);
  return '<span class="' + (r > 0 ? 'positif' : r < 0 ? 'negatif' : 'zero') + '">' + fmt(n) + '</span>';
}
function dateFr(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : ''; }
function toast(msg, ko) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast visible' + (ko ? ' ko' : '');
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, ko ? 6000 : 2800);
}
function appel(nom) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(e && e.message ? e : new Error(String(e))); });
    r[nom].apply(r, args);
  });
}
function erreur(e) { toast(e.message || String(e), true); console.error(e); }
function options(liste, choisi, vide) {
  return (vide !== undefined ? '<option value="">' + esc(vide) + '</option>' : '') + liste.map(function (o) {
    var v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o;
    return '<option value="' + esc(v) + '"' + (String(v) === String(choisi) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
function modale(html) { $('modaleBoite').innerHTML = html; $('modale').hidden = false; }
function fermerModale() { $('modale').hidden = true; }

/* ---------------------------------------------------------- données */
function codes() { return D.saisons.map(function (s) { return s.code; }); }
function courante() { var c = D.saisons.filter(function (s) { return s.courante; })[0]; return c ? c.code : codes().slice(-1)[0]; }
function precedente(s) { var i = codes().indexOf(s); return i > 0 ? codes()[i - 1] : null; }
function nomsLignes() { return D.lignes.slice().sort(function (a, b) { return a.ordre - b.ordre; }).map(function (l) { return l.ligne; }); }
function nomsUnites() { return D.unites.slice().sort(function (a, b) { return a.ordre - b.ordre; }).map(function (u) { return u.unite; }).filter(function (u, i, t) { return t.indexOf(u) === i; }); }
function reclasser() {
  C = {};
  codes().forEach(function (s) { C[s] = Engine.classer(D.ventilations[s] || [], D.regles, D.unites, D.corrections); });
}
/** Données du moteur ; `source` = id d'une version figée pour en utiliser le budget (sinon budget de travail). */
function donneesSynthese(source) {
  return { saisons: D.saisons, classees: C, lignes: D.lignes, budget: budgetPour(source), engagements: D.engagements, effectifs: D.effectifs };
}
/* --- versions du budget --- */
function versionsSaison(s) {
  return (D.versions || []).filter(function (v) { return v.saison === (s || ETAT.saison); }).sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
}
function versionReference(s) { return versionsSaison(s).filter(function (v) { return v.reference; })[0] || null; }
function versionParId(id) { return (D.versions || []).filter(function (v) { return v.id === id; })[0] || null; }
/** Postes d'une version figée, en montants gelés. */
function postesVersion(id) {
  return (D.budgetFige || []).filter(function (p) { return p.version === id; }).map(function (p) {
    return { saison: p.saison, ligne: p.ligne, sens: p.sens, poste: p.poste, unite: p.unite, methode: 'montant', montant: Engine.num(p.montant), commentaire: p.commentaire, evenement: p.evenement };
  });
}
function budgetPour(source) {
  var v = source && source !== 'courant' ? versionParId(source) : null;
  if (!v) return D.budget;
  return D.budget.filter(function (p) { return p.saison !== v.saison; }).concat(postesVersion(v.id));
}
function charger(silencieux) {
  if (!silencieux) $('vue').innerHTML = '<div class="chargement">Lecture du classeur…</div>';
  return appel('getDonnees').then(function (d) {
    D = d;
    if (!ETAT.saison || codes().indexOf(ETAT.saison) < 0) ETAT.saison = courante();
    // Pièce comptable (AAAAMMJJ_n) → fichier du dossier Drive des justificatifs
    D.pieces = {};
    (D.fichiers || []).forEach(function (nom) { var id = Engine.idFichier(nom); if (id && !D.pieces[id]) D.pieces[id] = { nom: nom, url: (D.liensFichiers || {})[nom] || '' }; });
    reclasser();
    $('saison').innerHTML = options(codes().slice().reverse(), ETAT.saison);
    var jExp = joursAvantExpiration();
    $('alertes').innerHTML = (D.groupe && !D.groupe.configure ? '<div class="alerte info">Bienvenue ! Commence par renseigner ton groupe (nom, logo, adresse) dans ' +
      '<a href="#" onclick="ETAT.param=\'groupe\';aller(\'parametres\');return false">Paramètres › Groupe</a>, puis suis le guide d\u2019installation.</div>' : '') +
      (D.erreurs || []).map(function (e) { return '<div class="alerte ko">' + esc(e) + '</div>'; }).join('') +
      (jExp !== null && jExp <= 30 ? '<div class="alerte' + (jExp <= 7 ? ' ko' : '') + '">⏳ Le jeton GitHub du robot ' + (jExp < 0 ? 'a expiré' : 'expire dans ' + jExp + ' jour(s)') +
        ' (' + dateFr(D.github.expiration) + '). Crée-en un nouveau et colle-le dans <a href="#" onclick="ETAT.param=\'imports\';aller(\'parametres\');return false">Paramètres › Imports</a>.</div>' : '');
    $('infoDonnees').textContent = D.journal.length ? 'Comptaweb du ' + dernierRobot() : 'Pas encore de données Comptaweb';
    $('infoDonnees').title = 'Classeur lu à ' + new Date(D.maintenant).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    afficher();
  }).catch(erreur);
}
function dernierRobot() {
  var j = D.journal[D.journal.length - 1];
  if (!j) return '';
  var d = new Date(j.date);
  return isNaN(d) ? j.date : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

/* ------------------------------------------------------------ navigation */
function menu() {
  var lib = {}; VUES.forEach(function (v) { lib[v[0]] = v[1]; });
  var syn = Engine.synthese(donneesSynthese(), ETAT.saison), pastilles = {};
  if (syn.aClasser.nombre) pastilles.realise = ['wa', syn.aClasser.nombre];
  var ouverts = D.engagements.filter(function (e) { return e.saison === ETAT.saison && ['regle', 'annule'].indexOf(Engine.cle(e.statut)) < 0; }).length;
  if (ouverts) pastilles.engagements = ['pl', ouverts];
  try { var reste = routineEtapes().etapes.filter(function (e) { return !e.fait; }).length; if (reste) pastilles.routine = ['pl', reste]; } catch (e) { }
  try {
    var j = Engine.controleJustificatifs(D.ecritures[ETAT.saison] || [], D.fichiers).manquants.length;
    if (j) pastilles.controles = ['wa', j];
  } catch (e) { }
  function bouton(k) {
    var p = pastilles[k];
    return '<button data-vue="' + k + '" class="' + (ETAT.vue === k ? 'on' : '') + '">' + svg(ICONES[k]) + esc(lib[k]) +
      (p ? ' <span class="pill ' + p[0] + '">' + p[1] + '</span>' : '') + '</button>';
  }
  var g = D.groupe || {}, logo = g.logo || (LOGO.indexOf('data:') === 0 ? LOGO : '');
  document.title = g.titre || 'Budget du groupe';
  $('nav').innerHTML = '<div class="brand">' + (logo ? '<img class="logo-groupe" src="' + esc(logo) + '" alt="Logo du groupe">' : '') +
    esc(g.titre || 'Budget du groupe') + (g.nom ? '<small>' + esc(g.nom.replace(/^Groupe\s+/i, '')) + '</small>' : '') + '</div>' +
    '<div class="nav-main">' + NAV_GROUPES.map(function (g) { return g.map(bouton).join(''); }).join('<hr class="nav-sep">') + '</div>' +
    '<div class="nav-bas">' + bouton('controles') + bouton('parametres') +
    '<a class="navlien" href="' + esc(D.classeurUrl) + '" target="_blank" rel="noopener" title="Ouvrir le classeur Google Sheets dans un nouvel onglet">' +
    svg('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/>') + 'Google Sheet' +
    svg('<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>', 'width:12px;height:12px;margin-left:auto') + '</a></div>';
}
/** Ouvre une ligne dans la page Budget (bon onglet) et place le curseur sur sa première case. */
function allerBudget(ligne, sens) {
  if (sens === 'Recette') aller('recettes');
  else { ETAT.budgetOnglet = ONGLET_DE_SAISIE[saisie(ligne)] || 'synthese'; aller('budget'); }
  var sel = saisie(ligne) === 'par_jeune' && sens !== 'Recette' ? '[data-f^="mv|"]' : '[data-f*="|' + ligne.replace(/["\\]/g, '\\$&') + '"]';
  var e = document.querySelector(sel);
  if (e) { e.scrollIntoView({ block: 'center' }); e.focus(); if (e.select) e.select(); }
}
/** Ouvre le Réalisé filtré sur une ligne, pour une saison donnée. */
function allerReel(ligne, saison, extra) {
  extra = extra || {};
  if (saison && saison !== ETAT.saison) { ETAT.saison = saison; $('saison').value = saison; }
  aller('realise', { ligne: ligne, unite: extra.unite || '', texte: '', cat: extra.cat || null });
}
/** Cellule de réel cliquable : ouvre le Réalisé de la saison, filtré sur la ligne (et l'unité ou la catégorie). */
function tdReel(montant, ligne, saison, extra, classes) {
  var c = 'n' + (classes ? ' ' + classes : '');
  if (!montant || !saison) return '<td class="' + c + '">' + fmt(montant) + '</td>';
  return '<td class="' + c + ' lien" title="Voir les écritures ' + esc(saison) + '" onclick="allerReel(' + jsArg(ligne) + ',' + jsArg(saison) + ',' + jsArg(extra || {}) + ')">' + fmt(montant) + '</td>';
}
function aller(vue, filtre) {
  if (ETAT.modifie && vue !== ETAT.vue && !confirm('Des modifications ne sont pas enregistrées. Les abandonner ?')) return;
  if (vue !== ETAT.vue) ETAT.modifie = false;
  ETAT.vue = vue;
  if (filtre) { for (var k in filtre) ETAT.filtre[k] = filtre[k]; ETAT.filtre.limite = 200; }
  afficher();
  window.scrollTo(0, 0);
}
function afficher() {
  if (!D) return;
  $('robotEntete').innerHTML = boutonRobot('discret');
  menu();
  var v = VUES.filter(function (x) { return x[0] === ETAT.vue; })[0];
  $('titre').textContent = v[1];
  var f = { synthese: vueSynthese, routine: vueRoutine, budget: vueBudget, recettes: vueRecettes, realise: vueRealise, engagements: vueEngagements, flux: vueFlux, controles: vueControles, parametres: vueParametres }[ETAT.vue];
  $('vue').innerHTML = f();
}

/* ------------------------------------------------------------- synthèse */
function vueSynthese() {
  var src = ETAT.versionSynthese && versionParId(ETAT.versionSynthese) && versionParId(ETAT.versionSynthese).saison === ETAT.saison ? ETAT.versionSynthese : 'courant';
  var syn = Engine.synthese(donneesSynthese(src), ETAT.saison);
  var rec = syn.sections[0].total, dep = syn.sections.slice(1);
  var depB = dep.reduce(function (a, s) { return a + (s.total.budget || 0); }, 0);
  var depR = dep.reduce(function (a, s) { return a + (s.total.reel || 0); }, 0);
  var just = Engine.controleJustificatifs(D.ecritures[ETAT.saison] || [], D.fichiers);
  var h = '<div class="tuiles">' +
    tuile('Résultat projeté', fmt(syn.net.projete), 'budget ' + fmt(syn.net.budget) + ' · écart ' + ecart(syn.net.varProjete)) +
    tuile('Recettes encaissées', euros(rec.reel), 'sur ' + euros(rec.budget) + ' budgétées', jauge(rec.reel, rec.budget, true)) +
    tuile('Dépenses réalisées', euros(-depR), 'sur ' + euros(-depB) + ' budgétées', jauge(-depR, -depB)) +
    tuile('Flux hors budget', fmt(syn.soldeHorsBudget.reel), 'camps, cotisations, extra-jobs') +
    tuile('À classer', syn.aClasser.nombre, syn.aClasser.nombre ? 'écritures sans ligne' : 'tout est classé', '', "aller('realise',{ligne:'__aclasser'})") +
    tuile('Justificatifs', just.manquants.length, just.manquants.length ? 'dépenses sans pièce' : 'tout est en ordre', '', "aller('controles')") +
    '</div>';
  var n2 = syn.n2 ? 'Réel ' + syn.n2 : '', n1 = syn.n1 ? 'Réel ' + syn.n1 : '';
  var vs = versionsSaison();
  if (vs.length) {
    h += '<div class="filtres"><span class="aide">Budget affiché :</span><select onchange="ETAT.versionSynthese=this.value;afficher()">' +
      options([{ v: 'courant', l: 'Version de travail (en cours)' }].concat(vs.slice().reverse().map(function (v) { return { v: v.id, l: (v.reference ? '★ ' : '') + v.nom + ' (' + String(v.date).slice(0, 10) + ')' }; })), src) +
      '</select>' + (src !== 'courant' ? '<span class="pill pl">version figée</span>' : '') + '</div>';
  }
  h += '<div class="carte"><div class="tableau-defile"><table class="synthese budget">' + cols(['lib'].concat(syn.n2 ? ['n'] : [], syn.n1 ? ['n'] : [], ['bn'], syn.n1 ? ['n'] : [], ['n', 'n', 'n', 'n', 'n'])) + '<thead><tr><th></th>' +
    (n2 ? '<th class="n masque-mobile">' + n2 + '</th>' : '') + (n1 ? '<th class="n">' + n1 + '</th>' : '') +
    '<th class="n col-n">Budget</th>' + (n1 ? '<th class="n masque-mobile">vs N-1</th>' : '') +
    '<th class="n col-n">Réel</th><th class="n masque-mobile">vs budget</th>' +
    '<th class="n col-n">À venir</th><th class="n">Projeté</th><th class="n">vs budget</th></tr></thead><tbody>';
  // Cellules cliquables : budget → page Budget, réels → Réalisé de la saison, à venir → engagements
  function rangee(l, cls, sens) {
    var L = jsArg(l.ligne);
    function lien(action, titre) { return sens ? ' lien" title="' + titre + '" onclick="' + action : ''; }
    return '<tr class="' + (cls || '') + '"><td>' + esc(l.ligne) + '</td>' +
      (n2 ? '<td class="n masque-mobile' + lien('allerReel(' + L + ',\'' + syn.n2 + '\')', 'Voir les écritures ' + syn.n2) + '">' + fmt(l.n2) + '</td>' : '') +
      (n1 ? '<td class="n' + lien('allerReel(' + L + ',\'' + syn.n1 + '\')', 'Voir les écritures ' + syn.n1) + '">' + fmt(l.n1) + '</td>' : '') +
      '<td class="n col-n' + lien('allerBudget(' + L + ',\'' + sens + '\')', 'Ouvrir dans le budget') + '">' + fmt(l.budget) + '</td>' +
      (n1 ? '<td class="n masque-mobile">' + ecart(l.varN1) + '</td>' : '') +
      '<td class="n col-n' + lien('allerReel(' + L + ',ETAT.saison)', 'Voir les écritures') + '">' + fmt(l.reel) + '</td><td class="n masque-mobile">' + ecart(l.varBudget) + '</td>' +
      '<td class="n col-n' + lien('aller(\'engagements\')', 'Voir les engagements') + '">' + fmt(l.engage) + '</td><td class="n"><b>' + fmt(l.projete) + '</b></td><td class="n">' + ecart(l.varProjete) + '</td></tr>';
  }
  var ncol = 7 + (n1 ? 2 : 0) + (n2 ? 1 : 0);
  syn.sections.forEach(function (s) {
    h += '<tr class="section"><td colspan="' + ncol + '">' + esc(s.titre) + '</td></tr>';
    s.lignes.forEach(function (l) { h += rangee(l, '', s.sens === 'r' ? 'Recette' : 'Dépense'); });
    h += rangee(s.total, 'total');
  });
  h += rangee(syn.net, 'grand-total');
  h += '</tbody></table></div><p class="aide">Recettes en positif, dépenses entre parenthèses. Un écart positif est favorable. ' +
    '« À venir » = engagements saisis et non réglés. Clique un montant de budget pour l\u2019ouvrir dans le budget, un réel pour voir ses écritures.</p></div>';

  // Hors budget
  h += '<div class="carte"><div class="entete-carte"><div><h2>Flux hors budget du groupe</h2><p class="sous">Camps, cotisations reversées au National, extra-jobs des unités, régularisations N-1.</p></div>' +

    '<th class="n col-n">Recettes</th><th class="n">Dépenses</th><th class="n">Solde</th></tr></thead><tbody>';
  syn.horsBudget.forEach(function (x) {
    h += '<tr class="cliquable" onclick="aller(\'realise\',{ligne:' + esc(JSON.stringify(x.ligne)) + '})"><td>' + esc(x.ligne) + '</td>' +

      '<td class="n col-n">' + fmt(x.recettes.reel) + '</td><td class="n">' + fmt(x.depenses.reel) + '</td><td class="n"><b>' + fmt(x.solde.reel) + '</b></td></tr>';
  });
  h += '<tr class="total"><td>Solde</td>' + (n1 ? '<td></td><td></td><td class="n">' + fmt(syn.soldeHorsBudget.n1) + '</td>' : '') +
    '<td class="col-n"></td><td></td><td class="n">' + fmt(syn.soldeHorsBudget.reel) + '</td></tr></tbody></table></div></div>';
  var rbs = ETAT.saison === courante() ? rapproBanque() : null, depBq = rbs ? rbs.mouvements.filter(function (m) { return m.montant < 0; }) : [];
  if (depBq.length) {
    h += '<div class="alerte">' + depBq.length + ' dépense(s) passée(s) en banque mais pas encore saisie(s) dans Comptaweb (' + euros(-depBq.reduce(function (a, m) { return a + m.montant; }, 0)) +
      ') ne sont pas dans le réel. <a href="#" onclick="aller(\'controles\');return false">Voir le rapprochement bancaire</a></div>';
  }
  if (syn.aClasser.nombre) {
    h += '<div class="alerte">' + syn.aClasser.nombre + ' ventilation(s) sans ligne de budget (' + euros(syn.aClasser.depenses) + ' de dépenses, ' +
      euros(syn.aClasser.recettes) + ' de recettes) ne sont pas dans la synthèse. <a href="#" onclick="aller(\'realise\',{ligne:\'__aclasser\'});return false">Les classer</a></div>';
  }
  return h;
}
function tuile(lib, val, det, extra, clic) {
  return '<div class="tuile' + (clic ? ' cliquable" onclick="' + clic : '') + '"><div class="lib">' + esc(lib) + '</div><div class="val">' + val + '</div>' +
    (det ? '<div class="det">' + det + '</div>' : '') + (extra || '') + '</div>';
}
function jauge(v, total, recette) {
  if (!total) return '';
  var p = Math.round(100 * v / total);
  return '<div class="jauge" style="margin-top:6px" title="' + p + ' %"><i class="' + (p > 100 && !recette ? 'depasse' : '') + '" style="width:' + Math.min(100, Math.max(0, p)) + '%"></i></div>';
}

/* --------------------------------------------------------------- budget */
/* Page « Budget - Dépenses » : onglets Synthèse, Sorties, Week-ends, Dîners, Fonctionnement.
 * Page « Budget - Recettes » : un montant par ligne.
 * Chaque ligne de dépense a une « saisie » (colonne Saisie du budget de l'onglet Lignes). */
var SAISIES = [
  { v: '', l: 'Automatique' }, { v: 'par_unite', l: 'Sorties : € par jeune et par unité' }, { v: 'weekend', l: 'Week-end : bloc par catégorie' },
  { v: 'diner', l: 'Dîner : alimentation + divers' }, { v: 'montant', l: 'Fonctionnement : montant' }, { v: 'par_jeune', l: 'Mouvement : barème par jeune' }

  D.budget = D.budget.filter(function (p) { return suppr.indexOf(p.id) < 0; });
  postes.forEach(function (p) {
    if (D.budget.indexOf(p) >= 0) return;

/* Préremplir les cases vides depuis N-1 (budget N-1 s'il existe, sinon réel N-1) */
function preremplir(onglet) {
  var s = ETAT.saison, n1 = precedente(s); if (!n1) return;
  var eff = Engine.compilerEffectifs(D.effectifs), n = 0, actions = [], CH = chiffresLignes().dep;
  function aBudget(l) { return postesDe(l, 'Dépense', n1).length > 0; }
  lignesDepenses().filter(function (l) { return ONGLET_DE_SAISIE[saisie(l)] === onglet; }).forEach(function (l) {
    var mode = saisie(l);
    if (mode === 'par_unite') {
      unitesJeunes().forEach(function (u) {
        var deja = postesDe(l, 'Dépense').some(function (q) { return q.unite === u && q.methode === 'par_jeune' && nombre(q.prix); });
        if (deja) return;
        var p1 = postesDe(l, 'Dépense', n1).filter(function (q) { return q.unite === u && q.methode === 'par_jeune'; })[0];
        var j1 = eff.unite(n1, u), r = Engine.reelParUnite(C[n1] || [], l)[u] || 0;
        var prix = p1 ? nombre(p1.prix) : (j1 ? Math.round(r / j1) : 0);
        if (prix) { actions.push(function () { majParJeune(l, u, prix); }); n++; }
      });
    } else if (mode === 'weekend' || mode === 'diner') {
      CATEGORIES[mode].forEach(function (c) {
        if (postesDe(l, 'Dépense').some(function (p) { return categorie(p.poste, mode) === c && Engine.montantPoste(p, eff); })) return;
        var v = aBudget(l) ? postesDe(l, 'Dépense', n1).filter(function (p) { return categorie(p.poste, mode) === c; }).reduce(function (a, p) { return a + Engine.montantPoste(p, eff); }, 0)
          : reelDep(n1, l, function (x) { return categorie(x.nature, mode) === c; });
        v = Math.round(v);
        if (v > 0) { actions.push(function () { majCategorie(l, mode, c, v); }); n++; }
      });
    } else {
      if (mode !== 'par_jeune' && budgetLigne(l, 'Dépense')) return;
      if (mode === 'par_jeune') {
        COMPOSANTES_MVT.forEach(function (c) {
          if (postesDe(l, 'Dépense').some(function (p) { return composante(p.poste) === c && nombre(p.prix); })) return;
          var p1 = postesDe(l, 'Dépense', n1).filter(function (p) { return composante(p.poste) === c; });
          var prix = p1.reduce(function (a, p) { return a + (p.methode === 'montant' ? 0 : nombre(p.prix)); }, 0);
          if (!prix && eff.total(n1)) prix = Math.round(reelDep(n1, l, function (v) { return composante(v.nature) === c; }) / eff.total(n1) * 100) / 100;
          if (prix) { actions.push(function () { majComposante(l, c, prix); }); n++; }
        });
      } else {
        var v = Math.round(aBudget(l) ? budgetLigne(l, 'Dépense', n1) : (CH[l] ? CH[l].n1 : 0));
        if (v > 0) { actions.push(function () { majFonctionnement(l, v, false); }); n++; }
      }
    }
  });
  if (!n) return toast('Rien à préremplir : les cases sont déjà remplies ou N-1 est vide.');
  if (!confirm(n + ' case(s) vide(s) vont être remplies depuis ' + n1 + '. Continuer ?')) return;
  actions.forEach(function (f) { f(); });
}

/** Lit un fichier en base64 ; les images sont réduites à 2000 px de côté (JPEG). */
function lireFichierDepot(f) {
  return new Promise(function (ok, ko) {
    var r = new FileReader();
    r.onerror = function () { ko(new Error('Lecture impossible : ' + f.name)); };
    r.onload = function () {
      var url = String(r.result);
      if (!/^image\//.test(f.type) || /gif|svg/.test(f.type)) return ok({ nom: f.name, type: f.type || 'application/pdf', base64: url.split(',')[1] });
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 2000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ nom: f.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = function () { ok({ nom: f.name, type: f.type, base64: url.split(',')[1] }); };   // format non lisible par le navigateur (HEIC…) : envoyé tel quel
      img.src = url;
    };
    r.readAsDataURL(f);
  });
}
function envoyerDepot() {
  var e = window._depot, fs = Array.prototype.slice.call($('dpFichiers').files || []);
  if (!fs.length) return toast('Choisis au moins un fichier.', true);
  var trop = fs.filter(function (f) { return !/^image\//.test(f.type) && f.size > 15 * 1024 * 1024; })[0];
  if (trop) return toast(trop.name + ' dépasse 15 Mo.', true);
  $('dpOk').disabled = true; $('dpOk').textContent = 'Envoi…';
  Promise.all(fs.map(lireFichierDepot)).then(function (liste) {
    return appel('deposerJustificatif', e.piece, $('dpDesc').value, liste);
  }).then(function (out) {
    out.forEach(function (o, i) {
      D.fichiers.push(o.nom); D.liensFichiers = D.liensFichiers || {}; D.liensFichiers[o.nom] = o.url;
      if (i === 0) D.pieces[e.piece] = { nom: o.nom, url: o.url };
    });
    fermerModale(); afficher();
    toast(out.length > 1 ? out.length + ' fichiers déposés' : 'Justificatif déposé : ' + out[0].nom);
  }).catch(function (err) { $('dpOk').disabled = false; $('dpOk').textContent = 'Déposer'; erreur(err); });
}

function supprimerAttestation(id) {

/* ------------------------------------------------------------ routine du mois */
var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function joursDepuis(iso) { var d = new Date(String(iso)); return isNaN(d) ? 999 : Math.floor((new Date(D.maintenant) - d) / 86400000); }
/** Étapes du mois : vérifiées automatiquement quand c'est possible, sinon à cocher. */
function routineEtapes() {
  var s = courante(), mois = String(D.maintenant).slice(0, 7), m0 = Number(mois.slice(5, 7)), E = [];
  var v = C[s] || [], ecr = D.ecritures[s] || [];
  var dernier = D.journal.length ? D.journal[D.journal.length - 1].date : '';
  E.push({ id: 'robot', lib: 'Actualiser Comptaweb', auto: true, ok: !!dernier && joursDepuis(dernier) <= 3,
    detail: dernier ? 'dernière actualisation le ' + dernierRobot() : 'jamais actualisé', action: D.github.configure ? 'lancerRobot()' : "ETAT.param='imports';aller('parametres')", bouton: 'Actualiser' });
  var ac = v.filter(function (x) { return !x.ligne; }).length;
  E.push({ id: 'classer', lib: 'Classer les nouvelles écritures', auto: true, ok: !ac, detail: ac ? ac + ' écriture(s) à classer' : 'tout est classé', action: "aller('realise',{ligne:'__aclasser'})" });
  var j = Engine.controleJustificatifs(ecr, D.fichiers).manquants.length;
  E.push({ id: 'justif', lib: 'Récupérer les justificatifs manquants (ou faire une attestation)', auto: true, ok: !j, detail: j ? j + ' dépense(s) sans justificatif' : 'tout est justifié', action: "aller('controles')" });
  var nr = Engine.nonRapprochees(ecr, new Date(D.maintenant), 15).length, rbp = rapproBanque();
  if (rbp && rbp.paires.length) nr = Math.max(nr, rbp.paires.length);
  E.push({ id: 'rappro', lib: 'Rapprocher les écritures dans Comptaweb', auto: true, ok: !nr, detail: nr ? nr + ' écriture(s) non rapprochée(s) depuis plus de 15 jours' : 'tout est rapproché', action: "aller('controles')" });
  var rb = rapproBanque();
  if (rb) E.push({ id: 'banque', lib: 'Saisir dans Comptaweb les opérations bancaires sans écriture', auto: true, ok: !rb.mouvements.length,
    detail: rb.mouvements.length ? rb.mouvements.length + ' opération(s) du relevé sans écriture (' + euros(rb.mouvements.reduce(function (a, m) { return a + m.montant; }, 0)) + ')' : 'tout le relevé est saisi', action: "aller('controles')" });
  var rq = rapprochementComptaweb(s);
  E.push({ id: 'concordance', lib: 'Vérifier la concordance avec la requête Comptaweb', auto: true, ok: rq.ok === true,
    detail: rq.ok === null ? 'requête pas encore récupérée' : rq.ok ? 'requête et export concordants' : 'écart entre la requête et l’export', action: "aller('controles')" });
  var corr = Engine.correspondancesEngagements(D.engagements, v, s).length;
  E.push({ id: 'engagements', lib: 'Solder les engagements réglés', auto: true, ok: !corr, detail: corr ? corr + ' engagement(s) dont l’écriture est arrivée' : 'rien à solder', action: "aller('engagements')" });
  E.push({ id: 'tickets', lib: 'Collecter les tickets des cartes (corporate, procurement) et des caisses d’unité', auto: false, action: "aller('controles')" });
  E.push({ id: 'budget', lib: 'Faire le point budget : Synthèse comparée au budget voté', auto: false, action: "aller('synthese')" });
  // Rentrée : saison, effectifs, budget voté
  if (m0 === 8 || m0 === 9) {
    var an = Number(mois.slice(0, 4)), code = an + '-' + String(an + 1).slice(2);
    var sc = D.saisons.filter(function (x) { return x.code === code; })[0];
    E.push({ id: 'saison', lib: 'Ouvrir la saison ' + code + ' (Paramètres › Imports › Saisons, avec l’exercice Comptaweb)', auto: true, ok: !!(sc && sc.courante),
      detail: sc ? (sc.courante ? 'saison ouverte et courante' : 'saison créée mais pas courante') : 'saison pas encore créée', action: "ETAT.param='imports';aller('parametres')" });
  }
  if (m0 >= 9 && m0 <= 11) {
    var eff = Engine.compilerEffectifs(D.effectifs).total(s);
    E.push({ id: 'effectifs', lib: 'Saisir les effectifs de la saison', auto: true, ok: eff > 0, detail: eff ? eff + ' jeunes saisis' : 'aucun effectif saisi', action: "ETAT.budgetOnglet='sorties';aller('budget')" });
  }
  if (m0 >= 10 && m0 <= 12) {
    var ref = versionReference(s);
    E.push({ id: 'vote', lib: 'Faire voter le budget et le figer comme référence', auto: true, ok: !!ref, detail: ref ? '« ' + ref.nom + ' »' : 'pas encore de budget de référence', action: "ETAT.budgetOnglet='versions';aller('budget')" });
  }
  var fait = {};
  (D.routine || []).forEach(function (r) { if (String(r.mois).slice(0, 7) === mois) fait[r.etape] = r; });
  E.forEach(function (e) { e.coche = fait[e.id] || null; e.fait = e.auto ? (e.ok || !!e.coche) : !!e.coche; });
  return { mois: mois, etapes: E };
}
function vueRoutine() {
  var R = routineEtapes(), n = R.etapes.filter(function (e) { return e.fait; }).length, tot = R.etapes.length;

      : (e.coche ? 'fait le ' + esc(String(e.coche.faitLe).slice(8, 10) + '/' + String(e.coche.faitLe).slice(5, 7)) : '');
    h += '<div class="etape' + (e.fait ? ' faite' : '') + '"><label><input type="checkbox"' + (e.fait ? ' checked' : '') + (verrouille ? ' disabled title="Vérifié automatiquement"' : '') +
      ' onchange="cocherEtape(' + jsArg(R.mois) + ',' + jsArg(e.id) + ',this.checked)"><span><b>' + esc(e.lib) + '</b>' + (info ? '<br><span class="aide">' + info + '</span>' : '') + '</span></label>' +
      '<button class="btn discret petit" onclick="' + e.action + '">' + (e.bouton || 'Ouvrir') + '</button></div>';
  });
  h += '</div></div>';
  return h;

function cocherEtape(mois, etape, fait) {
  var rows = (D.routine || []).filter(function (r) { return !(String(r.mois) === mois && r.etape === etape); });
  if (fait) rows.push({ mois: mois, etape: etape, faitLe: new Date().toISOString().slice(0, 16).replace('T', ' '), par: '' });

}
